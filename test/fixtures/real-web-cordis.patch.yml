# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).

# Out-of-process ACP subagent backend. The `subagents` registry is a process
# singleton — the api-proxy serves its cross-session queries to the browser, and
# a provider name may only be registered once — so the provider itself lives on
# the host plane, not in an agent preset. A preset contributes only the
# delegation tool that resolves this registry.
#
# `@deepseek-ai/dsh-subagent-acp` declares no `dsh.bundle`, so `dsh plugin add`
# installed it as a plain dependency rather than a profile layer; this row is
# what mounts it. Keep it version-matched to the running runtime:
#   dsh plugin --profile web add -w @deepseek-ai/dsh-subagent-acp@0.1.7-alpha.2
- insert:
    - id: subagent-acp
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: ccacp
        # Use local installation (npx has spawn issues with claude CLI)
        command: /opt/example/bin/claude-agent-acp
        # Auto-answer the child's permission requests with the first allow
        # option; `reject` would leave the child read-only. No prompt ever
        # reaches a human.
        permission: allow
        # Override model and effort level via environment variables
        # (overrides /opt/example/claude/settings.json which defaults to claude-fable-5)
        env:
          ANTHROPIC_MODEL: claude-opus-5
          CLAUDE_CODE_EFFORT_LEVEL: xhigh
        # `cwd` omitted on purpose: each child inherits its delegating parent
        # session's cwd.

- insert:
    - id: subagent-acp-cursor
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: cursoracp
        command: /opt/example/bin/agent
        # 不要在这里加 `--model`：cursor-agent 的 `acp` 子命令下，只要带上
        # `--model`（哪怕值是白名单里的 `cursor-grok-4.6-high`，甚至 `auto`），
        # `session/new` 就会失败并返回
        #   -32603 Internal error / "Failed to initialize session services"
        # 子 agent 随即降级成 auto。实测：不带 --model 时 session/new 6 秒内成功。
        #
        # 模型改为通过 ACP 协议持久化选择：cursor 把选择写入
        # /opt/example/cursor/acp-config.json（"selectedModelVariantId"），新建 ACP 会话
        # 会读取它。当前已设为 grok-4.6[effort=high,fast=true]，即 Grok 4.6 +
        # effort=high，session/new 返回的 currentModelId 已确认为该值。
        #
        # 注意 ACP 与交互式 CLI 是两套模型 ID 命名空间：
        #   交互式 `agent models` → cursor-grok-4.6-high / -xhigh-fast ...
        #   ACP availableModels   → grok-4.6[effort=high,fast=true]
        # ACP 侧只接受 availableModels 里精确列出的变体（fast=false 会被拒），
        # 且 grok 4.6 仅提供 effort=high 一档，没有 xhigh。
        args: [ "--trust", "acp" ]
        permission: allow

# Kiro CLI over the same ACP backend. `kiro-cli acp` is a first-class
# subcommand, so no wrapper is needed: model and effort are CLI flags rather
# than environment variables (unlike the `ccacp` row above), and
# `--trust-all-tools` is Kiro's own auto-approve. `permission: allow` still
# answers any request that does reach the protocol, so neither layer prompts.
# Auth comes from the Kiro CLI credential store (IAM Identity Center); the
# process inherits it, so this row carries no embedded credentials.
- insert:
    - id: subagent-acp-kiro
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: kiroopsuacp
        command: /opt/example/bin/kiro-cli
        args:
          - acp
          - --trust-all-tools
          - --model
          - claude-opus-5
          - --effort
          - xhigh
          # Pin the first session's agent (ACP "mode"). Without this, Kiro
          # resolves `chat.defaultAgent` from its own settings — currently
          # `dev`, which does not exist, so it logs "user defined default dev
          # not found" and falls back. Naming `kiro_default` makes the mode
          # explicit and independent of that setting, and keeps the child off
          # the planning agents (`kiro_planner` / `planner`), which do not edit
          # code. Verified over ACP: session/new reports
          # modes.currentModeId=kiro_default.
          - --agent
          - kiro_default
        permission: allow

- insert:
    - id: subagent-acp-kiro-gpt
      name: '@deepseek-ai/dsh-subagent-acp'
      config:
        providerName: kirogptacp
        command: /opt/example/bin/kiro-cli
        args:
          - acp
          - --trust-all-tools
          - --model
          - claude-opus-5.5
          - --effort
          - xhigh
          # Pin the first session's agent (ACP "mode"). Without this, Kiro
          # resolves `chat.defaultAgent` from its own settings — currently
          # `dev`, which does not exist, so it logs "user defined default dev
          # not found" and falls back. Naming `kiro_default` makes the mode
          # explicit and independent of that setting, and keeps the child off
          # the planning agents (`kiro_planner` / `planner`), which do not edit
          # code. Verified over ACP: session/new reports
          # modes.currentModeId=kiro_default.
          - --agent
          - kiro_default
        permission: allow

