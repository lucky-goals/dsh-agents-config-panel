<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>模型能力 · 设置原型</title>
<style>
/* ===== Token 定义（唯一允许出现字面色值的地方） ===== */
body {
  --dsw-alias-bg-base: #fff;
  --dsw-alias-bg-layer-1: #fff;
  --dsw-alias-bg-layer-2: #fff;
  --dsw-alias-bg-layer-3: #fff;
  --dsw-alias-label-primary: #0f1115;
  --dsw-alias-label-secondary: #61666b;
  --dsw-alias-label-tertiary: #81858c;
  --dsw-alias-label-primary-foreground: #fff;
  --dsw-alias-button-primary-fill: #0f1115;
  --dsw-alias-button-primary-hover: #43454a;
  --dsw-alias-border-l2: #0000001a;
  --dsw-alias-border-l4: #00000029;
  --dsw-alias-state-success-primary: #22c55e;
  --dsw-alias-state-error-primary: #ec1313;
  --dsw-alias-link: #4176e6;
  --dsw-alias-specific-sidebar-fill: #f9fafb;
  --dsw-focus-ring: #4176E6;
  --dsw-radius-xs: 4px;
  --dsw-radius-sm: 8px;
  --dsw-radius-md: 12px;
  --dsw-radius-lg: 16px;
  --dsw-radius-xl: 20px;
  --mc-font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
  --mc-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  --mc-ease: 180ms ease;
}
body[data-ds-dark-theme] {
  --dsw-alias-bg-base: #151517;
  --dsw-alias-bg-layer-1: #232324;
  --dsw-alias-bg-layer-2: #2c2c2e;
  --dsw-alias-bg-layer-3: #353638;
  --dsw-alias-label-primary: #f9fafb;
  --dsw-alias-label-secondary: #cfd3d6;
  --dsw-alias-label-tertiary: #adb2b8;
  --dsw-alias-label-primary-foreground: #0f1115;
  --dsw-alias-button-primary-fill: #f9fafb;
  --dsw-alias-button-primary-hover: #ebeef2;
  --dsw-alias-border-l2: #ffffff1f;
  --dsw-alias-border-l4: #ffffff33;
  --dsw-alias-state-error-primary: #f25a5a;
  --dsw-alias-link: #7aaaff;
  --dsw-alias-specific-sidebar-fill: #1b1b1c;
  --dsw-focus-ring: #7AAAFF;
}
/* ===== 基础 ===== */
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--mc-font);
  font-size: 14px; line-height: 22px;
  color: var(--dsw-alias-label-primary);
  background: var(--dsw-alias-bg-base);
  min-width: 800px; min-height: 100vh;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled, input:disabled { cursor: not-allowed; }
:focus { outline: none; }
:focus-visible { outline: 2px solid var(--dsw-focus-ring); outline-offset: 2px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--mc-mono); }

/* ===== 调试条（模态外） ===== */
.debugbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 8px 16px; font-size: 12px; line-height: 18px;
  color: var(--dsw-alias-label-tertiary);
  border-bottom: 0.5px dashed var(--dsw-alias-border-l4);
}
.debugbar strong { font-weight: 500; color: var(--dsw-alias-label-secondary); margin-right: 4px; }
.debugbar button {
  height: 24px; padding: 0 8px; border-radius: var(--dsw-radius-xs);
  border: 0.5px dashed var(--dsw-alias-border-l4); background: transparent;
  color: var(--dsw-alias-label-secondary); font-size: 12px;
}
.debugbar button[aria-pressed="true"] { border-style: solid; color: var(--dsw-alias-label-primary); background: var(--dsw-alias-bg-layer-3); }
.debugbar .sep { width: 1px; height: 14px; background: var(--dsw-alias-border-l4); }

/* ===== 模态壳 ===== */
.stage { display: flex; justify-content: center; padding: 32px 16px 48px; }
.modal {
  width: 760px; height: 500px; flex: none;
  display: flex; flex-direction: column;
  background: var(--dsw-alias-bg-layer-1);
  border: 0.5px solid var(--dsw-alias-border-l4);
  border-radius: var(--dsw-radius-xl); overflow: hidden;
}
.modal-title {
  height: 48px; flex: none; display: flex; align-items: center; justify-content: space-between;
  padding: 0 12px 0 20px; border-bottom: 0.5px solid var(--dsw-alias-border-l2);
  font-size: 16px; font-weight: 500; line-height: 24px;
}
.modal-body { flex: 1; min-height: 0; display: flex; }
.sidenav {
  width: 168px; flex: none; padding: 8px; display: flex; flex-direction: column; gap: 2px;
  background: var(--dsw-alias-specific-sidebar-fill);
  border-right: 0.5px solid var(--dsw-alias-border-l2);
}
.sidenav button {
  height: 32px; text-align: left; padding: 0 10px; border: 0; background: transparent;
  border-radius: var(--dsw-radius-sm); color: var(--dsw-alias-label-secondary);
}
.sidenav button:hover { background: var(--dsw-alias-bg-layer-3); }
.sidenav button[aria-current="page"] { background: var(--dsw-alias-bg-layer-3); color: var(--dsw-alias-label-primary); font-weight: 500; }
.contentcol { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
.scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.savebar {
  height: 48px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 16px;
  border-top: 0.5px solid var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-layer-1);
}
.savebar .count { flex: 1; font-size: 13px; color: var(--dsw-alias-label-secondary); }
.savebar .count.err { color: var(--dsw-alias-state-error-primary); }
.savebar .rev { font-size: 11px; color: var(--dsw-alias-label-tertiary); }

/* ===== 排版 ===== */
.h1 { margin: 0; font-size: 16px; font-weight: 500; line-height: 24px; }
.h2 { margin: 0; font-size: 14px; font-weight: 500; line-height: 22px; }
.desc { margin: 0; font-size: 14px; line-height: 22px; color: var(--dsw-alias-label-tertiary); }
.small { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); }
.hint { font-size: 12px; line-height: 18px; color: var(--dsw-alias-label-tertiary); margin: 4px 0 0; }
.err { color: var(--dsw-alias-state-error-primary); }
.errtext { font-size: 12px; line-height: 18px; color: var(--dsw-alias-state-error-primary); margin: 4px 0 0; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.spacer { flex: 1; }
.head { display: flex; align-items: flex-start; gap: 12px; }
.head > div:first-child { flex: 1; min-width: 0; }
.statusline { font-size: 12px; color: var(--dsw-alias-label-tertiary); min-height: 18px; }

/* ===== 按钮 ===== */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap;
  height: 28px; padding: 0 10px; border-radius: var(--dsw-radius-sm);
  border: 0.5px solid var(--dsw-alias-border-l4); background: transparent;
  color: var(--dsw-alias-label-primary); font-size: 13px;
  transition: background var(--mc-ease), color var(--mc-ease);
}
.btn:hover:not(:disabled) { background: var(--dsw-alias-bg-layer-3); }
.btn.primary {
  height: 36px; padding: 0 16px; border-radius: var(--dsw-radius-md); border: 0;
  background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); font-size: 14px; font-weight: 500;
}
.btn.primary:hover:not(:disabled) { background: var(--dsw-alias-button-primary-hover); }
.btn.primary.sm { height: 28px; padding: 0 12px; border-radius: var(--dsw-radius-sm); font-size: 13px; }
.btn.danger { border: 0; color: var(--dsw-alias-state-error-primary); }
.btn.ghost { border: 0; color: var(--dsw-alias-label-secondary); }
.btn:disabled { opacity: .45; }
.linkbtn { border: 0; background: none; padding: 0; color: var(--dsw-alias-link); font-size: 13px; }
.linkbtn:hover:not(:disabled) { text-decoration: underline; }
.linkbtn:disabled { opacity: .45; }
.iconbtn { width: 28px; height: 28px; border: 0; background: transparent; border-radius: var(--dsw-radius-sm); color: var(--dsw-alias-label-secondary); }
.iconbtn:hover:not(:disabled) { background: var(--dsw-alias-bg-layer-3); }

/* ===== 卡 ===== */
.card {
  border: 0.5px solid var(--dsw-alias-border-l4); background: var(--dsw-alias-bg-layer-2);
  border-radius: var(--dsw-radius-xl); padding: 12px 14px;
}
.pcard { display: flex; align-items: center; gap: 12px; }
.pcard .main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.pcard .name { font-size: 14px; font-weight: 500; }
.pcard .url { font-size: 12px; color: var(--dsw-alias-label-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pcard .meta { font-size: 12px; color: var(--dsw-alias-label-secondary); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.tag {
  display: inline-block; font-size: 11px; line-height: 16px; padding: 0 6px; border-radius: var(--dsw-radius-xs);
  border: 0.5px solid var(--dsw-alias-border-l4); color: var(--dsw-alias-label-secondary); font-weight: 400; vertical-align: 1px;
}
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.ok { background: var(--dsw-alias-state-success-primary); }
.dot.bad { background: var(--dsw-alias-state-error-primary); }
.readonly-line { font-size: 12px; color: var(--dsw-alias-label-tertiary); }
.skeleton { height: 76px; border-radius: var(--dsw-radius-xl); background: var(--dsw-alias-bg-layer-3); border: 0.5px solid var(--dsw-alias-border-l2); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .5; } }
.empty { text-align: center; padding: 24px 12px; display: flex; flex-direction: column; align-items: center; gap: 12px; }

/* ===== 信息条 ===== */
.banner {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: var(--dsw-radius-md);
  border: 0.5px solid var(--dsw-alias-border-l4); background: var(--dsw-alias-bg-layer-2); font-size: 13px; line-height: 20px;
}
.banner.error { border-color: var(--dsw-alias-state-error-primary); }
.banner .txt { flex: 1; }
.banner .mark { width: 16px; height: 16px; border-radius: 50%; flex: none; margin-top: 2px; font-size: 11px; line-height: 16px; text-align: center; border: 0.5px solid var(--dsw-alias-border-l4); color: var(--dsw-alias-label-secondary); }
.banner.error .mark { border-color: var(--dsw-alias-state-error-primary); color: var(--dsw-alias-state-error-primary); }

/* ===== 表单 ===== */
.field { display: flex; flex-direction: column; gap: 4px; }
.field > label, .field > .lbl { font-size: 13px; font-weight: 500; color: var(--dsw-alias-label-primary); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.input {
  height: 32px; padding: 0 10px; border-radius: var(--dsw-radius-sm);
  border: 0.5px solid var(--dsw-alias-border-l4); background: var(--dsw-alias-bg-layer-1); width: 100%; min-width: 0;
}
.input.invalid { border-color: var(--dsw-alias-state-error-primary); }
.input:disabled { color: var(--dsw-alias-label-tertiary); background: var(--dsw-alias-bg-layer-3); }
.input.sm { height: 28px; }
.section { display: flex; flex-direction: column; gap: 10px; padding: 12px 14px; border-radius: var(--dsw-radius-lg); border: 0.5px solid var(--dsw-alias-border-l2); }
.section-title { font-size: 13px; font-weight: 500; }
.check { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; }
.check input { margin: 0; accent-color: var(--dsw-alias-button-primary-fill); }

/* 开关 */
.switch { display: inline-flex; align-items: center; gap: 8px; border: 0; background: none; padding: 0; font-size: 13px; }
.switch .trk { width: 32px; height: 18px; border-radius: 9px; background: var(--dsw-alias-bg-layer-3); border: 0.5px solid var(--dsw-alias-border-l4); position: relative; transition: background var(--mc-ease); }
.switch .trk::after { content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: var(--dsw-alias-label-tertiary); transition: transform var(--mc-ease), background var(--mc-ease); }
.switch[aria-checked="true"] .trk { background: var(--dsw-alias-button-primary-fill); }
.switch[aria-checked="true"] .trk::after { transform: translateX(14px); background: var(--dsw-alias-label-primary-foreground); }

/* 芯片 */
.chips { display: inline-flex; gap: 6px; flex-wrap: wrap; }
.chip {
  height: 28px; padding: 0 12px; border-radius: var(--dsw-radius-sm); font-size: 13px;
  border: 0.5px solid var(--dsw-alias-border-l4); background: transparent; color: var(--dsw-alias-label-secondary);
  transition: background var(--mc-ease), color var(--mc-ease);
}
.chip[aria-pressed="true"] { background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); border-color: transparent; }
.chip.inherit, .chip.inherit[aria-pressed="true"] { border: 0.5px dashed var(--dsw-alias-border-l4); background: transparent; color: var(--dsw-alias-label-tertiary); cursor: default; }
.chip.inherit.off { opacity: .5; }

/* ===== 签名控件：思考档位轨道 ===== */
.rail-wrap { display: inline-flex; align-items: flex-end; gap: 12px; }
.rail-grp { display: flex; flex-direction: column; gap: 2px; }
.rail-grp .cap { font-size: 11px; line-height: 14px; color: var(--dsw-alias-label-tertiary); padding-left: 4px; }
.rail {
  display: flex; height: 32px; padding: 2px; border-radius: var(--dsw-radius-sm);
  background: var(--dsw-alias-bg-layer-3); gap: 0;
}
.rn {
  width: 64px; height: 28px; padding: 0; margin-left: 3px; font-size: 13px;
  border: 0.5px solid var(--dsw-alias-border-l4); background: transparent; color: var(--dsw-alias-label-secondary);
  border-radius: 6px; transition: background var(--mc-ease), color var(--mc-ease);
}
.rn:first-child { margin-left: 0; }
.rn:hover:not(:disabled):not(.on) { color: var(--dsw-alias-label-primary); }
.rn.on { background: var(--dsw-alias-button-primary-fill); color: var(--dsw-alias-label-primary-foreground); border-color: transparent; }
/* 相邻已选贴合成台阶：中间无缝，圆角只在段两端 */
.rn.on.join-l { margin-left: 0; border-top-left-radius: 0; border-bottom-left-radius: 0; }
.rn.on.join-r { border-top-right-radius: 0; border-bottom-right-radius: 0; }
.rn:disabled { opacity: .4; }
.rail-marks { display: flex; padding: 0 2px; height: 14px; }
.rail-marks span { width: 64px; margin-left: 3px; text-align: center; font-size: 11px; line-height: 14px; color: var(--dsw-alias-label-tertiary); }
.rail-marks span:first-child { margin-left: 0; }
.rail-marks span.j { margin-left: 0; }

/* ===== 模型表 ===== */
/* 表头与数据行共用 .mtable 这一套列轨道（subgrid），auto 列按全表最宽内容统一定宽 */
/* 左右内边距放在 .mtable 上（subgrid 行不再吃掉首尾列宽度）；行分隔线用伪元素铺满整表宽 */
.mtable {
  border: 0.5px solid var(--dsw-alias-border-l4); border-radius: var(--dsw-radius-lg); overflow: visible; padding: 0 12px;
  display: grid; grid-template-columns: 24px minmax(120px,1.6fr) minmax(100px,1fr) minmax(64px,1.2fr) minmax(104px,max-content) max-content; column-gap: 8px;
}
.mrow {
  grid-column: 1 / -1; display: grid; grid-template-columns: subgrid; align-items: center; column-gap: 8px;
  padding: 8px 0; font-size: 13px; position: relative;
}
.mrow::before, .mfoot::before { content: ""; position: absolute; top: 0; left: -12px; right: -12px; border-top: 0.5px solid var(--dsw-alias-border-l2); pointer-events: none; }
.mrow > * { min-width: 0; }
.mrow > .selcell { display: flex; align-items: center; justify-content: flex-start; }
.mrow > .selcell input { margin: 0; accent-color: var(--dsw-alias-button-primary-fill); }
.mrow .think { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .cap .bad { color: var(--dsw-alias-state-error-primary); }
.mfoot { grid-column: 1 / -1; position: relative; }
.mrow:first-child::before { display: none; }
.mrow.hdr { font-size: 12px; color: var(--dsw-alias-label-tertiary); padding: 6px 0; }
.mrow .mid { font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .mname { font-size: 12px; color: var(--dsw-alias-label-tertiary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow .ops { display: flex; gap: 4px; justify-content: flex-end; }
.mrow .sum { color: var(--dsw-alias-label-secondary); }
.mrow .sum.legacy { color: var(--dsw-alias-label-tertiary); }
.mrow .cap { white-space: nowrap; font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.mrow .cap .ex { color: var(--dsw-alias-label-secondary); }
.mrow .cap .inh { color: var(--dsw-alias-label-tertiary); }
.mrow .cap .slash { color: var(--dsw-alias-label-tertiary); white-space: pre; }
.tag.old { margin-left: 4px; color: var(--dsw-alias-label-tertiary); border-style: dashed; }
/* 容量控件 */
.capf { display: flex; flex-direction: column; gap: 4px; }
.capf .capline { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.capf .capline .input { width: 140px; flex: none; }
.capf .abbr { font-size: 12px; color: var(--dsw-alias-label-secondary); font-variant-numeric: tabular-nums; }
.capf .chips { margin-top: 2px; }
.chip.sm { height: 24px; padding: 0 8px; font-size: 12px; }
.mfoot { display: flex; align-items: center; gap: 8px; padding: 8px 0; }
/* 选择工具条（表格正上方） */
.seltool { display: flex; align-items: center; gap: 12px; min-height: 28px; }
.seltool .selcount { font-size: 14px; font-weight: 500; line-height: 22px; font-variant-numeric: tabular-nums; }
/* 行菜单：挂在 #app 末尾，fixed 定位，位置由脚本按模态安全区计算 */
.menu {
  position: fixed; left: 0; top: 0; z-index: 40; min-width: 132px; padding: 4px;
  display: flex; flex-direction: column; border-radius: var(--dsw-radius-md);
  background: var(--dsw-alias-bg-layer-1); border: 0.5px solid var(--dsw-alias-border-l4);
  overflow-y: auto;
}
.menu > * { flex: none; }
.menu button { text-align: left; height: 30px; padding: 0 10px; border: 0; background: transparent; border-radius: 6px; font-size: 13px; }
.menu button:hover:not(:disabled), .menu button:focus-visible { background: var(--dsw-alias-bg-layer-3); }
.menu button.danger { color: var(--dsw-alias-state-error-primary); }
.menu button:disabled { opacity: .4; }
.menu hr { border: 0; border-top: 0.5px solid var(--dsw-alias-border-l2); margin: 4px 0; width: 100%; }
/* 批量层：几何同编辑层，中间滚动，底部摘要钉住 */
.bradios { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.bradios .check.dis { opacity: .45; cursor: not-allowed; }
.bsub { display: flex; flex-direction: column; gap: 6px; }
.bsrc { display: flex; flex-direction: column; gap: 4px; }
.bulkfoot {
  flex: none; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  border-top: 0.5px solid var(--dsw-alias-border-l2); background: var(--dsw-alias-bg-layer-1);
}
.bulkfoot .bsum { flex: 1; min-width: 0; margin: 0; font-size: 13px; line-height: 20px; color: var(--dsw-alias-label-secondary); }
.bulkfoot .bsum.err { color: var(--dsw-alias-state-error-primary); }

/* 线上拼写 */
.spell { display: grid; grid-template-columns: 64px 1fr auto auto; gap: 8px; align-items: center; }
.spell .lvl { font-size: 13px; color: var(--dsw-alias-label-secondary); }

/* ===== 覆盖层 / 对话框 ===== */
.layer {
  position: absolute; inset: 0 0 48px 0; z-index: 10; display: flex; flex-direction: column;
  background: var(--dsw-alias-bg-layer-1);
}
.layer.enter { animation: slidein 220ms ease; }
@keyframes slidein { from { transform: translateX(100%); } to { transform: none; } }
.scrim { position: absolute; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center; background: var(--dsw-alias-border-l4); }
.dialog {
  width: 400px; max-width: calc(100% - 32px); padding: 16px; display: flex; flex-direction: column; gap: 12px;
  background: var(--dsw-alias-bg-layer-1); border: 0.5px solid var(--dsw-alias-border-l4); border-radius: var(--dsw-radius-lg);
}
.dialog .actions { display: flex; justify-content: flex-end; gap: 8px; }
.toast { font-size: 12px; color: var(--dsw-alias-label-secondary); display: flex; align-items: center; gap: 8px; }

/* 向导 */
.steps { display: flex; gap: 8px; align-items: center; font-size: 13px; color: var(--dsw-alias-label-tertiary); list-style: none; margin: 0; padding: 0; }
.steps li { display: flex; align-items: center; gap: 6px; }
.steps .n { width: 20px; height: 20px; border-radius: 50%; font-size: 11px; line-height: 19px; text-align: center; border: 0.5px solid var(--dsw-alias-border-l4); }
.steps li[aria-current="step"] { color: var(--dsw-alias-label-primary); font-weight: 500; }

<script>

/* ================= 工具 ================= */

function resolvedInput(r, m) {

function inputSummary(r, m) {

/* ---------- 容量 ---------- */
const hasKey = (o, k) => Object.prototype.hasOwnProperty.call(o, k);

  const ls = orderLevels(eff);

  if (ls.length === 1) return ls[0];
  const idx = ls.map(l => ALL.indexOf(l));

function hasLegacy(r) { return isPi(r) && r.models.some(m => m.inputModalities); }

/* ================= 校验 ================= */
function modelErrors(r, m, idx) {

  else if (/\s/.test(id)) e.id = 'ID 不能包含空格';
  else if (r.models.some((o, j) => j !== idx && o.id === id)) e.id = '这个提供方里已有同名模型';

  if (ce.mt) e.maxTokens = ce.mt;

      const ls = orderLevels(m.reasoningEfforts);
      if (!ls.length) e.efforts = '勾选至少一档，或改为不思考。';
      ls.forEach(l => { if (m.reasoningEfforts[l] === '') e['spell_' + l] = '线上拼写不能为空；与档名相同或写成 null。'; });

function routeErrors(r) {

    const me = r.models.map((m, i) => modelErrors(r, m, i));

function idWarn(id) { return id && /[A-Z_]/.test(id) ? '建议只用小写字母、数字和连字符。' : ''; }

// 顺序：空 → 字符集 → 重复
function providerIdError(id) {

  if (!PROVIDER_ID_RE.test(id)) return '提供方 ID 只能用小写字母、数字和连字符，且不能以连字符开头或结尾。不能含点号，否则配置路径会歧义。';

/* ================= 序列化 / diff ================= */
// 只输出显式且合法的容量值
function capOut(o, c) {

const CAP_ROUTE_KEYS = ['defaultContextWindow', 'defaultMaxTokens', 'maxTokens'];

function yScalar(v) {

    return '\n' + v.map(x => {

const app = document.getElementById('app');

function render(opts) {

    fk = fkey(act);
    try { ss = act.selectionStart; se = act.selectionEnd; } catch (_) { /* 非文本输入 */ }
  }
  const scrolls = {};
  app.querySelectorAll('[data-scroll]').forEach(s => { scrolls[s.dataset.scroll] = s.scrollTop; });
  const st = computeOps();
  const errCount = Object.keys(allErrors(draft)).length;

    main = '<div class="head"><div><h2 class="h1">模型能力</h2><p class="desc">' + LIST_DESC + '</p></div>' +
      '<button type="button" class="btn primary" disabled>添加提供方</button></div>' +

  else if (ui.view === 'wizard') main = viewWizard();

  const scrollKey = 'main:' + ui.view + ':' + (ui.route || '') + ':' + (ui.wizard ? ui.wizard.step : '');
  let layer = '';
  if (ui.edit && !ui.loading) {
    layer = ui.edit.kind === 'model' ? layerModel() : layerAccess();

  } else if (ui.bulk && !ui.loading) layer = layerBulk();   // 批量层与编辑层互相替换，不叠加
  // 编辑层打开：主区 inert；对话框打开：主区、编辑层、保存条都 inert
  const INERT = ' inert aria-hidden="true"';
  const dlg = !!ui.dialog;
  if (layer && dlg) layer = layer.replace('<div class="layer', '<div' + INERT + ' class="layer');
  let bar = savebarHTML(st, errCount);
  if (dlg) bar = bar.replace('<div class="savebar"', '<div class="savebar"' + INERT);
  rendering = true;
  const menu = layer || dlg ? (ui.menu = null, '') : rowMenuHTML();
  app.innerHTML = '<div class="scroll"' + (layer || dlg ? INERT : '') + ' data-scroll="' + esc(scrollKey) + '">' + bannersHTML() + main + '</div>' + layer + bar + dialogHTML(st) + menu;
  rendering = false;
  app.querySelectorAll('[data-scroll]').forEach(s => { if (scrolls[s.dataset.scroll] != null) s.scrollTop = scrolls[s.dataset.scroll]; });
  placeMenu();
  // 密钥只放进 DOM 属性值，不进 HTML 文本、不进 diff
  const as = app.querySelector('[data-field="a-secret"]');
  if (as && ui.edit) as.value = secrets[ui.edit.route] || '';
  const ws = app.querySelector('[data-field="w-secret"]');

  if (ui.saving || ui.loading) {
    app.querySelectorAll('button,input,select').forEach(el => { if (!el.dataset.navok || ui.saving) el.disabled = true; });
  } else if (ui.readonly) {
    // 只读仍可：导航、预览、取消添加、对话框的取消/确认
    const keep = (el) => el.dataset.navok || el.dataset.rook || el.dataset.act === 'wiz-cancel' || el.closest('.dialog');
    app.querySelectorAll('button,input,select').forEach(el => { if (!keep(el)) el.disabled = true; });
  }
  if (ui.edit) ui.edit.enter = false;
  if (ui.bulk) ui.bulk.enter = false;
  let target = null;
  if (opts.focus) target = app.querySelector(opts.focus);
  else if (opts.focusKey) target = findKey(opts.focusKey);
  if (!target && fk) {
    target = findKey(fk);
    if (target && ss != null) { target.focus({ preventScroll: true }); try { target.setSelectionRange(ss, se); } catch (_) { /* 忽略 */ } return; }
  }
  if (target && !target.disabled) target.focus({ preventScroll: !!(opts.preventScroll || (fk && !opts.focus && !opts.focusKey)) });
}

    case 'a-url': rset(curRoute(), 'baseURL', String(v).trim() === '' ? '' : v); break;
    case 'a-env': curRoute().apiKeyEnv = v; break;

    case 'a-hk': case 'a-hv': curRoute().headers[idx][f === 'a-hk' ? 'k' : 'v'] = v; break;
    case 'w-api': w.api = v; break;

    case 'w-ack': w.ack = v; break;

    return;
  }
  if (e.key === 'Tab' && ui.dialog) {
    const f = [...app.querySelectorAll('.dialog input:not([disabled]), .dialog button:not([disabled])')];
    if (!f.length) return;
    const i = f.indexOf(document.activeElement);
    if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
    else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
    else if (i === -1) { e.preventDefault(); f[0].focus(); }
    return;
  }
  if (t.classList && t.classList.contains('rn') && ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', 'Home', 'End'].includes(e.key)) {
    e.preventDefault();
    const wrap = t.closest('.rail-wrap');
    const nodes = [...wrap.querySelectorAll('.rn:not([disabled])')];
    if (!nodes.length) return;
    let i = nodes.indexOf(t);
    if (e.key === 'Home') i = 0; else if (e.key === 'End') i = nodes.length - 1;
    else i = (i + (e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? -1 : 1) + nodes.length) % nodes.length;
    const n = nodes[i];
    if (wrap.dataset.mode === 'multi') {
      // 多选：方向键只移动焦点，Space 切换
      nodes.forEach(x => { x.tabIndex = -1; });
      n.tabIndex = 0; n.focus();
      return;
    }
    // radiogroup：方向键移动焦点并同时选中
    railSelect(n.dataset.rail, n.dataset.lvl);
    return render({ focus: '.rn[data-rail="' + CSS.escape(n.dataset.rail) + '"][data-lvl="' + n.dataset.lvl + '"]' });
  }
  // 行菜单：方向键在可用项间循环（跳过禁用项），Home/End 到首尾；Tab/Shift+Tab 关闭且不激活
  if (ui.menu && t.closest && t.closest('#row-menu-pop')) {
    if (e.key === 'Tab') { e.preventDefault(); return closeMenu(); }
    if (['ArrowDown', 'ArrowUp', 'Home', 'End'].includes(e.key)) {
      e.preventDefault();
      const items = [...t.closest('#row-menu-pop').querySelectorAll('[role="menuitem"]:not([disabled])')];
      if (!items.length) return;
      let i = items.indexOf(t);
      if (e.key === 'Home') i = 0; else if (e.key === 'End') i = items.length - 1;
      else i = (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items[i].focus({ preventScroll: true });
    }
  }
});
// 行菜单打开时：主区滚动或窗口 resize → 关闭并回焦「···」
app.addEventListener('scroll', (e) => {
  if (!ui.menu || rendering || menuScrollTop == null) return;
  const main = app.querySelector(':scope > .scroll');
  if (e.target !== main || Math.abs(main.scrollTop - menuScrollTop) < 1) return;
  closeMenu();
}, true);
window.addEventListener('resize', () => { if (ui.menu) closeMenu(); });

/* ================= 导航 + 调试条 ================= */
document.querySelector('.modal').addEventListener('click', (e) => {
  const n = e.target.closest('[data-nav]');
  if (!n) return;
  if (n.dataset.nav === 'close') say('原型里不能关闭设置。');
  else if (n.dataset.nav !== '模型能力') say('原型只做了模型能力。');
  render();
});
const mq = window.matchMedia('(prefers-color-scheme: dark)');
let themeManual = null;
const dbg = (k) => document.querySelector('[data-dbg="' + k + '"]');
function applyTheme() {
  const dark = themeManual === null ? mq.matches : themeManual;
  document.body.toggleAttribute('data-ds-dark-theme', dark);
  const b = dbg('theme');
  b.setAttribute('aria-pressed', String(dark));
  b.textContent = (dark ? '暗色' : '亮色') + (themeManual === null ? '（跟随系统）' : '（手动）');
}
if (mq.addEventListener) mq.addEventListener('change', () => { if (themeManual === null) applyTheme(); });
function syncDebug() {
  dbg('conflict').setAttribute('aria-pressed', String(ui.conflictArmed));
  dbg('readonly').setAttribute('aria-pressed', String(ui.readonly));
  dbg('loading').setAttribute('aria-pressed', String(ui.loading));
}
document.querySelector('.debugbar').addEventListener('click', (e) => {
  const b = e.target.closest('[data-dbg]');
  if (!b) return;
  const note = document.getElementById('dbg-note');
  switch (b.dataset.dbg) {
    case 'theme': themeManual = !document.body.hasAttribute('data-ds-dark-theme'); applyTheme(); return;
    case 'conflict': ui.conflictArmed = true; note.textContent = '下一次保存会遇到冲突。'; break;
    case 'unconflict': ui.conflictArmed = false; ui.conflictShown = false; ui.conflictKept = false; note.textContent = '已解除冲突。'; break;
    case 'readonly': ui.readonly = !ui.readonly; ui.menu = null; ui.dialog = null; ui.bulk = null; note.textContent = ''; break;
    case 'loading': ui.loading = !ui.loading; ui.menu = null; ui.dialog = null; ui.bulk = null; note.textContent = ''; break;
    case 'empty':
      customIds(base).forEach(k => delete base.routes[k]);
      customIds(draft).forEach(k => delete draft.routes[k]);
      Object.keys(secrets).forEach(k => delete secrets[k]);
      ui.view = 'list'; ui.route = null; ui.edit = null; ui.bulk = null; ui.wizard = null; ui.undo = null;
      note.textContent = '已模拟一份没有自定义提供方的配置。刷新页面复位。'; break;
  }
  syncDebug(); render();
});
applyTheme(); syncDebug(); render();
</script>
</body>
</html>
